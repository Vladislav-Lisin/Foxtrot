version: "3.9"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NUXT_PUBLIC_API_BASE=http://host.docker.internal:8080
    restart: unless-stopped

  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    command: ["pnpm", "dev", "--hostname", "0.0.0.0", "--port", "3000"]
    ports:
      - "3000:3000"
    volumes:
      - ./:/app:cached
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - NUXT_PUBLIC_API_BASE=http://host.docker.internal:8080
    stdin_open: true
    tty: true
    profiles:
      - dev
